<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Gift Registry</title>
<meta name="description" content="Browse our wedding gift registry and help us start our life together." />
<meta name="theme-color" content="#FDFAF6" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --warm-white: #FDFAF6;
    --petal: #F7EEE7;
    --blush: #E8D5C4;
    --sand: #C9A98A;
    --mocha: #6B5744;
    --deep: #3D2B1F;
    --text: #2E1F14;
    --muted: #9C8070;
    --success: #7A9E7E;
    --danger: #C97B6B;
    --radius: 14px;
    --radius-lg: 20px;
    --shadow: 0 4px 16px rgba(107,87,68,0.10), 0 1px 3px rgba(107,87,68,0.06);
    --shadow-lg: 0 14px 36px rgba(107,87,68,0.18), 0 4px 12px rgba(107,87,68,0.08);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --grad-accent: linear-gradient(135deg, var(--sand) 0%, var(--mocha) 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(1100px 560px at 100% -8%, rgba(247,238,231,0.9), transparent 60%),
      radial-gradient(900px 520px at -8% 108%, rgba(243,231,220,0.85), transparent 55%),
      var(--warm-white);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--blush); color: var(--deep); }
  ::-webkit-scrollbar { width: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--blush); border-radius: 10px; border: 3px solid var(--warm-white); }
  ::-webkit-scrollbar-thumb:hover { background: var(--sand); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── HERO ── */
  .hero {
    text-align: center;
    padding: 4rem 1.5rem 3rem;
    max-width: 640px;
    margin: 0 auto;
  }
  .hero-eyebrow {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--sand);
    margin-bottom: 0.75rem;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    font-weight: 300;
    color: var(--mocha);
    line-height: 1.1;
    margin-bottom: 1rem;
  }
  .hero-title em { font-style: italic; color: var(--sand); }
  .hero-sub {
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.7;
    max-width: 460px;
    margin: 0 auto;
  }
  .hero-divider {
    width: 48px; height: 1px;
    background: var(--blush);
    margin: 2rem auto;
  }

  /* ── FILTERS ── */
  .filters {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 1.5rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .filter-pill {
    background: white;
    border: 1px solid var(--blush);
    border-radius: 20px;
    padding: 0.35rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-pill:hover, .filter-pill.active {
    background: var(--blush);
    border-color: var(--blush);
    color: var(--mocha);
  }

  /* ── GRID ── */
  .gift-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  .gift-card {
    background: white;
    border: 1px solid var(--blush);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.22s var(--ease), box-shadow 0.22s var(--ease);
    animation: cardIn 0.4s var(--ease) both;
  }
  .gift-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }

  .gift-card-img {
    width: 100%; aspect-ratio: 4/3;
    object-fit: cover; display: block;
  }
  .gift-card-placeholder {
    width: 100%; aspect-ratio: 4/3;
    background: var(--petal);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; color: var(--blush);
  }
  .gift-card-body { padding: 1rem 1.1rem 1.2rem; }
  .gift-card-cat {
    font-size: 0.67rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--sand);
    margin-bottom: 0.35rem;
  }
  .gift-card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem; font-weight: 600;
    color: var(--mocha); line-height: 1.2;
    margin-bottom: 0.3rem;
  }
  .gift-card-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem; font-weight: 300;
    color: var(--text); margin-bottom: 0.4rem;
  }
  .gift-card-notes {
    font-size: 0.76rem; color: var(--muted);
    font-style: italic; margin-bottom: 0.85rem;
    line-height: 1.5;
  }
  .gift-buy-btn {
    display: block; width: 100%;
    background: var(--mocha); color: white;
    border: none; border-radius: 8px;
    padding: 0.6rem 1rem;
    font-family: 'Inter', sans-serif; font-size: 0.82rem;
    font-weight: 500; letter-spacing: 0.04em;
    text-align: center; text-decoration: none;
    cursor: pointer; transition: background 0.2s;
  }
  .gift-buy-btn:hover { background: var(--deep); }
  .gift-buy-btn.no-link {
    background: var(--petal); color: var(--muted);
    cursor: default; pointer-events: none;
  }

  /* ── STATES ── */
  .state-panel {
    text-align: center;
    padding: 4rem 2rem;
    max-width: 480px;
    margin: 0 auto;
  }
  .state-panel .icon { font-size: 3rem; margin-bottom: 1rem; }
  .state-panel h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 300;
    color: var(--mocha); margin-bottom: 0.75rem;
  }
  .state-panel p { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.75rem;
    color: var(--muted);
    border-top: 1px solid var(--petal);
  }
  footer a { color: var(--sand); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .gift-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
    .hero { padding: 3rem 1.25rem 2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gift-card, .gift-card:hover { animation: none; transition: none; transform: none; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-eyebrow">With love</div>
  <h1 class="hero-title">Our Gift <em>Registry</em></h1>
  <p class="hero-sub">Every item here is something we've chosen with our new life together in mind. Thank you for celebrating with us.</p>
  <div class="hero-divider"></div>
</div>

<div class="filters" id="filters"></div>
<div id="content"></div>

<footer>
  ♡ Made with care &nbsp;·&nbsp; <a href="index.html">Back to planner</a>
</footer>

<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
  );
}

function b64Decode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function priceStr(p) {
  const n = parseFloat(p);
  if (!p || isNaN(n)) return '';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

let allItems = [];
let activeFilter = 'All';

function renderGrid(filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.cat === filter);
  });
  const items = filter === 'All' ? allItems : allItems.filter(i => i.category === filter);
  const content = document.getElementById('content');
  if (!items.length) {
    content.innerHTML = `<div class="state-panel"><div class="icon">🎁</div><h2>Nothing here yet</h2><p>No gifts in this category.</p></div>`;
    return;
  }
  content.innerHTML = `<div class="gift-grid">${items.map((item, idx) => `
    <div class="gift-card" style="animation-delay:${Math.min(idx * 0.04, 0.4)}s">
      ${item.image
        ? `<img class="gift-card-img" src="${esc(item.image)}" alt="${esc(item.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex">`
        : ''}
      <div class="gift-card-placeholder" style="${item.image ? 'display:none' : ''}">🎁</div>
      <div class="gift-card-body">
        <div class="gift-card-cat">${esc(item.category)}</div>
        <div class="gift-card-name">${esc(item.name)}</div>
        ${item.price ? `<div class="gift-card-price">${esc(priceStr(item.price))}</div>` : ''}
        ${item.notes ? `<div class="gift-card-notes">${esc(item.notes)}</div>` : ''}
        ${item.url
          ? `<a class="gift-buy-btn" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">Buy this gift →</a>`
          : `<span class="gift-buy-btn no-link">Gift selected</span>`}
      </div>
    </div>`).join('')}</div>`;
}

function buildFilters(items) {
  const cats = ['All', ...new Set(items.map(i => i.category).filter(Boolean))];
  document.getElementById('filters').innerHTML = cats.map(c =>
    `<button class="filter-pill${c === 'All' ? ' active' : ''}" data-cat="${esc(c)}" onclick="renderGrid('${esc(c)}')">${esc(c)}</button>`
  ).join('');
}

function init() {
  const hash = location.hash.slice(1);
  const match = hash.match(/(?:^|&)r=([^&]*)/);
  if (!match) {
    document.getElementById('content').innerHTML = `
      <div class="state-panel">
        <div class="icon">🎁</div>
        <h2>Registry not found</h2>
        <p>This link doesn't include registry data. Ask the couple to generate a fresh shareable link from inside their planner.</p>
      </div>`;
    return;
  }
  try {
    allItems = JSON.parse(b64Decode(match[1]));
    if (!Array.isArray(allItems) || !allItems.length) throw new Error('empty');
    buildFilters(allItems);
    renderGrid('All');
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div class="state-panel">
        <div class="icon">🔗</div>
        <h2>Couldn't load registry</h2>
        <p>The link may be incomplete or corrupted. Ask the couple to copy a new shareable link.</p>
      </div>`;
  }
}

init();
</script>
</body>
</html>
